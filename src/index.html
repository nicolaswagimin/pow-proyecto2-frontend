<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>a11Lens</title>
    <meta name="description" content="Audita la accesibilidad de tu HTML, entiende cada problema y recibe el código corregido." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111219" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Solo los pesos que se usan: Atkinson Hyperlegible Next y Mono, 400 y 700. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap"
    />
    <script>
      // Aplica el tema guardado antes de pintar, para que no destelle el tema equivocado.
      try {
        var tema = localStorage.getItem('tema');
        if (tema === 'claro' || tema === 'oscuro') {
          document.documentElement.dataset.theme = tema === 'oscuro' ? 'dark' : 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
