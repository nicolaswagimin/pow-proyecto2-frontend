<div class="pagina">
  <header class="barra">
    <a class="marca" routerLink="/app">
      <svg class="marca__logo" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
        <circle class="marca__exterior" cx="12" cy="12" r="9.5" />
        <circle class="marca__lente" cx="12" cy="12" r="6.5" />
        <path class="marca__mango" d="m19 19 6.5 6.5" />
      </svg>
      {{ nombreApp }}
    </a>

    <div class="barra__acciones">
      <ui-theme-toggle />
      <div class="perfil">
        <ui-avatar class="perfil__avatar" [iniciales]="auth.iniciales()" />
        <div class="perfil__texto">
          <span class="perfil__nombre">{{ usuario()?.nombre }}</span>
          <span class="perfil__correo">{{ usuario()?.email }}</span>
        </div>
      </div>
      <ui-button variante="secundario" tamano="compacto" etiqueta="Cerrar sesión" (click)="salir()">
        <ui-icon nombre="salir" />
        <span class="solo-ancho">Cerrar sesión</span>
      </ui-button>
    </div>
  </header>

  <div class="hoja">
    <main class="contenido" #contenido>
      <section class="bienvenida">
        <h1>Hola, {{ primerNombre() }}</h1>
        <p class="bienvenida__texto">
          Aquí vas a pegar HTML o una URL para auditar su accesibilidad. Mientras tanto, enfoca
          cualquier control de esta página para ver sus anotaciones, o audítala completa desde el
          margen.
        </p>
      </section>

      <!-- En móvil el margen es una franja compacta: la auditoría va al pie. -->
      <app-auditoria class="auditoria-movil" />
    </main>

    <aside class="margen" aria-labelledby="titulo-anotaciones">
      <app-margen [ambito]="contenido" />
    </aside>
  </div>
</div>
