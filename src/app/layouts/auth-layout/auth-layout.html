<header class="cabecera">
  <a class="marca" routerLink="/">
    <svg class="marca__logo" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
      <circle class="marca__exterior" cx="12" cy="12" r="9.5" />
      <circle class="marca__lente" cx="12" cy="12" r="6.5" />
      <path class="marca__mango" d="m19 19 6.5 6.5" />
    </svg>
    {{ nombreApp }}
  </a>
  <ui-theme-toggle />
</header>

<div class="hoja">
  <main class="pagina" #pagina>
    <ng-content select="[auth-encabezado]" />
    <ng-content />
    <ng-content select="[auth-pie]" />
  </main>

  <aside class="margen" aria-labelledby="titulo-anotaciones">
    <app-margen [ambito]="pagina" />
  </aside>
</div>
