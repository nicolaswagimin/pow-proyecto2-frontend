<div class="campo__cabecera">
  <label class="campo__label" [for]="id">{{ label() }}</label>
</div>

<div
  class="campo campo--con-icono campo--con-ojo"
  [class.campo--enfocado]="enfocado()"
  [class.campo--error]="error()"
  [class.campo--deshabilitado]="deshabilitado()"
>
  <span class="campo__icono"><ui-icon nombre="candado" /></span>

  <input
    #control
    class="campo__control"
    type="password"
    [id]="id"
    [value]="valor()"
    [disabled]="deshabilitado()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-invalid]="error() ? true : null"
    [attr.aria-required]="requerido() || null"
    [attr.aria-describedby]="describedBy()"
    (input)="escribir($event)"
    (keydown)="revisarMayusculas($event)"
    (keyup)="revisarMayusculas($event)"
    (focus)="enfocado.set(true)"
    (blur)="salir()"
  />

  <!-- pointerdown.preventDefault: con el mouse, el foco se queda en el campo. -->
  <button
    type="button"
    class="ojo"
    [class.ojo--abierto]="visible()"
    [disabled]="deshabilitado()"
    [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    [attr.aria-pressed]="visible()"
    [attr.aria-controls]="id"
    (pointerdown)="$event.preventDefault()"
    (click)="alternarVisible()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <g class="ojo__globo">
        <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
        <circle class="ojo__pupila" cx="12" cy="12" r="3.2" />
      </g>
      <path
        class="ojo__cerrado"
        d="M3 10.5c2.6 3.4 5.6 5 9 5s6.4-1.6 9-5M6.6 14 5 16.6M12 15.6v3M17.4 14l1.6 2.6"
      />
    </svg>
  </button>
</div>

@if (error(); as mensaje) {
  @for (texto of [mensaje]; track texto) {
    <p class="campo__mensaje campo__mensaje--error" [id]="id + '-error'">
      <ui-icon nombre="alerta" />
      <span>{{ texto }}</span>
    </p>
  }
} @else if (ayuda()) {
  <p class="campo__mensaje" [id]="id + '-ayuda'">{{ ayuda() }}</p>
}

<div aria-live="polite">
  @if (mayusculas()) {
    <p class="campo__mensaje campo__mensaje--aviso" [id]="id + '-mayus'">
      <ui-icon nombre="mayus" />
      <span>Bloq Mayús está activado.</span>
    </p>
  }
</div>

@if (conMedidor() && valor()) {
  <ui-strength-meter [id]="id + '-medidor'" [password]="valor()" />
}
